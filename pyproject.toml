[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-snr"
version = "0.1.1"
description = "An L4/L5 Signal Firewall for AI Agents: context compression, loop entropy circuit breaking, attention budgeting, and skip-level routing."
readme = "README.md"
authors = [
    { name = "Sandeep Hipparagi" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "agents",
    "firewall",
    "llm",
    "snr",
    "signal-to-noise",
    "compression",
    "langgraph",
    "crewai",
    "circuit-breaker",
    "entropy",
    "routing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "pydantic>=2.0",
    "rich",
]

[project.urls]
Homepage = "https://github.com/Sandeep-Hipparagi/agent-snr"
Documentation = "https://github.com/Sandeep-Hipparagi/agent-snr#readme"
Repository = "https://github.com/Sandeep-Hipparagi/agent-snr"
Issues = "https://github.com/Sandeep-Hipparagi/agent-snr/issues"
Changelog = "https://github.com/Sandeep-Hipparagi/agent-snr/releases"

[project.optional-dependencies]
embeddings = [
    "fastembed>=0.3.0",
]
langgraph = [
    "langgraph>=0.2.0",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[project.scripts]
agent-snr = "agent_snr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "fastembed"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest_temp"
